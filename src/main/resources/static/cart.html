<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles/cart.css" />
</head>
<body>

    <div class="header">
        <h1>Your Shopping Cart</h1>
    </div>

    <div class="container">
        <div class="cart-section">
            <h2>Items in Your Cart</h2>
            <table class="cart-items">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody id="cartItems">
                    <tr>
                        <td>Product 1</td>
                        <td>$25.00</td>
                        <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
                        <td class="item-total">$25.00</td>
                        <td><button class="remove-btn" onclick="removeItem(this)">Remove</button></td>
                    </tr>
                    <tr>
                        <td>Product 2</td>
                        <td>$35.00</td>
                        <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
                        <td class="item-total">$35.00</td>
                        <td><button class="remove-btn" onclick="removeItem(this)">Remove</button></td>
                    </tr>
                    <tr>
                        <td>Product 3</td>
                        <td>$15.00</td>
                        <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
                        <td class="item-total">$15.00</td>
                        <td><button class="remove-btn" onclick="removeItem(this)">Remove</button></td>
                    </tr>
                </tbody>
            </table>

            <div class="total-section">
                Total: $<span id="totalPrice">75.00</span>
            </div>
            <button class="checkout-button" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <footer>
        &copy; 2025 Franqlin E-commerce. All rights reserved.
        <br>
        <a href="index.html">Home</a> | 
        <a href="modules.html">Products</a> | 
        <a href="contact.html">Contact Us</a>
    </footer>

    <script>
        function updateTotal() {
            let total = 0;
            const rows = document.querySelectorAll('.cart-items tbody tr');
            rows.forEach(row => {
                const price = parseFloat(row.cells[1].innerText.replace('$', ''));
                const quantity = parseInt(row.querySelector('input').value);
                const itemTotal = price * quantity;
                row.querySelector('.item-total').innerText = '$' + itemTotal.toFixed(2);
                total += itemTotal;
            });
            document.getElementById('totalPrice').innerText = total.toFixed(2);
        }

        function removeItem(button) {
            const row = button.closest('tr');
            row.remove();
            updateTotal();
        }

        function checkout() {
            alert("Proceeding to checkout...");
        }
    </script>

</body>
</html>
