<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Orders - ShopEasy</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            rel="stylesheet"
    />
    <style>
        /* Reuse existing styles */
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #f9fafb;
          color: #333;
          padding: 20px;
        }

        header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          max-width: 1000px;
          margin: 0 auto 40px;
          padding: 10px 20px;
          background: white;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
          border-radius: 10px;
          position: sticky;
          top: 0;
          z-index: 10;
        }

        header h1 {
          font-weight: 700;
          font-size: 1.8rem;
          color: #2563eb;
          cursor: pointer;
        }

        .cart-icon {
          position: relative;
          font-size: 28px;
          cursor: pointer;
          color: #2563eb;
        }

        .cart-count {
          position: absolute;
          top: -8px;
          right: -10px;
          background: #ef4444;
          color: white;
          border-radius: 50%;
          font-size: 14px;
          padding: 2px 7px;
          font-weight: 700;
          user-select: none;
        }

        main {
          max-width: 1000px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
          padding: 20px;
          min-height: 400px;
        }

        h2 {
          color: #2563eb;
          margin-top: 0;
          margin-bottom: 20px;
          text-align: center;
        }

        .orders-list {
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .order-item {
          border: 1px solid #e5e7eb;
          border-radius: 12px;
          padding: 15px;
        }

        .order-header {
          font-weight: 700;
          color: #2563eb;
          margin-bottom: 10px;
          display: flex;
          justify-content: space-between;
        }

        .order-details {
          color: #444;
        }

        .empty-orders {
          text-align: center;
          color: #888;
          font-size: 1.2rem;
          padding: 40px 0;
        }

        /* Back button */
        .btn-back {
          background: #2563eb;
          color: white;
          border: none;
          padding: 12px 20px;
          border-radius: 10px;
          font-weight: 600;
          cursor: pointer;
          margin-top: 30px;
          display: block;
          width: 150px;
          text-align: center;
          user-select: none;
          transition: background 0.3s;
          margin-left: auto;
          margin-right: auto;
        }

        .btn-back:hover {
          background: #1e40af;
        }
         footer {
            background-color: #333;
            color: #fff;
            padding: 15px;
            text-align: center;
            width: 100%;
            position: relative;
            bottom: 0;
        }
        footer a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>
    <h1 onclick="window.location.href='index.html'">🛒 ShopEasy</h1>
    <div style="display: flex; gap: 20px; align-items: center;">
        <div class="cart-icon" style="cursor: pointer;" onclick="window.location.href='e_cart.html'">
            <i class="fas fa-shopping-cart"></i>
            <div class="cart-count">3</div>
        </div>
        <div class="cart-icon" style="cursor: pointer;" title="View Orders" onclick="window.location.href='e_order.html'">
            <i class="fas fa-box-open"></i>
        </div>
    </div>
</header>

<main>
    <h2>Your Orders</h2>
    <div class="orders-list" aria-live="polite">
        <!-- Sample orders -->
        <div class="order-item">
            <div class="order-header">
                <span>Order #12345</span>
                <span>Completed</span>
            </div>
            <div class="order-details">
                <div>Laptop x1</div>
                <div>Headphones x2</div>
                <div>Total: $1297</div>
            </div>
        </div>

        <div class="order-item">
            <div class="order-header">
                <span>Order #12346</span>
                <span>Shipped</span>
            </div>
            <div class="order-details">
                <div>Smartphone x1</div>
                <div>Total: $599</div>
            </div>
        </div>
    </div>

    <button class="btn-back" onclick="window.location.href='index.html'">Back to Shop</button>
</main>
<footer>
    <p>&copy; 2025 Franqlin Ecommerce App. All rights reserved.</p>
</footer>
</body>
</html>
