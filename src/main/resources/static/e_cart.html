<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Cart - ShopEasy</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            rel="stylesheet"
    />
    <style>
        /* Reuse your existing styles for body, header, etc. */
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #f9fafb;
          color: #333;
          padding: 20px;
        }

        header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          max-width: 1000px;
          margin: 0 auto 40px;
          padding: 10px 20px;
          background: white;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
          border-radius: 10px;
          position: sticky;
          top: 0;
          z-index: 10;
        }

        header h1 {
          font-weight: 700;
          font-size: 1.8rem;
          color: #2563eb;
          cursor: pointer;
        }

        .cart-icon {
          position: relative;
          font-size: 28px;
          cursor: pointer;
          color: #2563eb;
        }

        .cart-count {
          position: absolute;
          top: -8px;
          right: -10px;
          background: #ef4444;
          color: white;
          border-radius: 50%;
          font-size: 14px;
          padding: 2px 7px;
          font-weight: 700;
          user-select: none;
        }

        main {
          max-width: 1000px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
          padding: 20px;
          min-height: 400px;
        }

        h2 {
          color: #2563eb;
          margin-top: 0;
          margin-bottom: 20px;
          text-align: center;
        }

        .cart-items {
          display: flex;
          flex-direction: column;
          gap: 15px;
        }

        .cart-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid #e5e7eb;
          padding-bottom: 10px;
        }

        .cart-item-name {
          font-weight: 600;
          flex: 2;
          color: #111827;
        }

        .cart-item-qty {
          flex: 1;
          text-align: center;
        }

        .cart-item-price {
          flex: 1;
          font-weight: 700;
          color: #ef4444;
          text-align: right;
        }

        .empty-cart {
          text-align: center;
          color: #888;
          font-size: 1.2rem;
          padding: 40px 0;
        }

        /* Buttons container */
        .buttons {
          display: flex;
          justify-content: center;
          gap: 20px;
          margin-top: 30px;
        }

        /* Common button style */
        .btn {
          background: #2563eb;
          color: white;
          border: none;
          padding: 12px 25px;
          border-radius: 10px;
          font-weight: 600;
          cursor: pointer;
          user-select: none;
          transition: background 0.3s;
          min-width: 150px;
          text-align: center;
        }

        .btn:hover {
          background: #1e40af;
        }
          footer {
            background-color: #333;
            color: #fff;
            padding: 15px;
            text-align: center;
            width: 100%;
            position: relative;
            bottom: 0;
        }
        footer a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>
    <h1 onclick="window.location.href='index.html'">🛒 ShopEasy</h1>
    <div style="display: flex; gap: 20px; align-items: center;">
        <div class="cart-icon" style="cursor: pointer;" onclick="window.location.href='e_cart.html'">
            <i class="fas fa-shopping-cart"></i>
            <div class="cart-count">3</div>
        </div>
        <div class="cart-icon" style="cursor: pointer;" title="View Orders" onclick="window.location.href='e_order.html'">
            <i class="fas fa-box-open"></i>
        </div>
    </div>
</header>

<main>
    <h2>Your Cart</h2>
    <div class="cart-items" aria-live="polite">
        <!-- Sample cart items -->
        <div class="cart-item">
            <div class="cart-item-name">Laptop</div>
            <div class="cart-item-qty">Qty: 1</div>
            <div class="cart-item-price">$899</div>
        </div>

        <div class="cart-item">
            <div class="cart-item-name">Headphones</div>
            <div class="cart-item-qty">Qty: 2</div>
            <div class="cart-item-price">$398</div>
        </div>
    </div>

    <div class="buttons">
        <button class="btn" onclick="window.location.href='index.html'">Continue Shopping</button>
        <button class="btn" onclick="window.location.href='e_checkout.html'">Proceed to Checkout</button>
    </div>
</main>
<footer>
    <p>&copy; 2025 Franqlin Ecommerce App. All rights reserved.</p>
</footer>
</body>
</html>
